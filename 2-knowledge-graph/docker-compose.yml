services:
  neo4j:
    image: neo4j:5.20-community
    container_name: coach-kg-neo4j
    ports:
      - "7474:7474"  # browser
      - "7687:7687"  # bolt
    environment:
      NEO4J_AUTH: neo4j/coach-kg-dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: coach-kg-api
    ports:
      - "8000:8000"
    environment:
      COACH_KG_GRAPH_BACKEND: neo4j
      COACH_KG_NEO4J_URI: bolt://neo4j:7687
      COACH_KG_NEO4J_USER: neo4j
      COACH_KG_NEO4J_PASSWORD: coach-kg-dev
      COACH_KG_LLM_PROVIDER: ${COACH_KG_LLM_PROVIDER:-fake}
      COACH_KG_LLM_MODEL: ${COACH_KG_LLM_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COACH_KG_EMBEDDINGS_PROVIDER: ${COACH_KG_EMBEDDINGS_PROVIDER:-hash}
      COACH_KG_SEED_ON_BOOT: "true"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
  neo4j-logs:
