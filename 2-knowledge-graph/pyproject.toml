[project]
name = "coach-kg"
version = "0.1.0"
description = "Knowledge graph coaching platform — GraphRAG over a synthetic member's context for safe, explainable fitness recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "anthropic>=0.40",
    "openai>=1.40",
    "neo4j>=5.18",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "tenacity>=8.2",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27",
]
embeddings = [
    "sentence-transformers>=2.7",
]

[project.scripts]
coach-kg = "app.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require a live Neo4j (skipped by default)",
    "llm: tests that hit a real LLM provider (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
